[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "getllamp-mcp"
version = "0.1.0"
description = "MCP Server for Z-machine interactive fiction games via Jericho"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "getllamp team" }
]
keywords = ["mcp", "interactive-fiction", "zork", "jericho", "z-machine"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
]

dependencies = [
    # Core Jericho interface
    "jericho>=3.1.0",
    "spacy>=3.7.0",
    
    # MCP Server
    "fastmcp>=2.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    
    # CLI
    "click>=8.1.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
]

[project.scripts]
getllamp-mcp = "mcp_server.server:main"

[tool.hatch.build.targets.wheel]
packages = ["mcp_server"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
